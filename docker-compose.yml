services:
  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    ports:
      - "7001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  mvc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7213:8080"
    depends_on:
      - api
    environment:
      - ApiSettings__BaseUrl=http://api:8080